name: build
on: [push, workflow_dispatch]
defaults:
  run:
    working-directory: uragiri_keys_mod_src_Ver2.1/uragiri_keys
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: uragiri_keys-jar-Ver2.1.0
          path: uragiri_keys_mod_src_Ver2.1/uragiri_keys/build/libs/uragiri_keys-2.1.0.jar
